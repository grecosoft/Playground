apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-one
  namespace: solution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-one
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: service-one
    spec:
      serviceAccountName: solution-identity
      containers:
        - name: service-one
          image: registryterrapin.azurecr.io/playground/service-one:1.0.0.48
          envFrom:
            - configMapRef:
                name: service-config-map
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"