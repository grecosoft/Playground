name: Build, Test, and create Docker Image for .NET Solution
on:
    workflow_call:
        inputs:
            solution-name:
                description: 'Name of the solution the service belongs to (used for Docker image naming)'
                type: string
                required: true
            service-root:
                description: 'Path to the service root directory'
                type: string
                required: true
            service-name:
                description: 'Name of the service (used for Docker image naming)'
                type: string
                required: true
            image-registry:
                description: 'Container registry to push the built image to (e.g., ghcr.io/your-org)'
                type: string
                required: true
            image-tag:
                description: 'Tag to use for the built Docker image (e.g., latest or 1.0.0)'
                type: string
                required: true
            
jobs:
    create-service-image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build Docker image
              run: |
                IMAGE_NAME="${{ inputs.image-registry }}/${{ inputs.solution-name }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"
                docker build ${{ inputs.service-root }} -t $IMAGE_NAME 
    
