name: .NET Build and Test Solution
on:
    workflow_call:
        inputs:
            solution-path:
                description: 'Path to the solution file to build'
                type: string
                required: true
            dotnet-version:
                required: false
                type: string
                default: '10.0.x'

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Job Setup
              id: setup
              run: echo "SolutionName=$(basename ${{ inputs.solution-path }})" >> $GITHUB_OUTPUT

            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                dotnet-version: ${{ inputs.dotnet-version }}
                cache: true
                cache-dependency-path: '**/packages.lock.json'

            - name: Restore - ${{ steps.setup.outputs.SolutionName }}
              run: dotnet restore ${{ inputs.solution-path }} --locked-mode

            - name: List Directory Contents
              run: ls -R -a /home/runner/.nuget/ 

            - name: Build - ${{ steps.setup.outputs.SolutionName }}
              run: | 
                dotnet build ${{ inputs.solution-path }} \
                --no-restore \
                --configuration Release

            - name: Test - ${{ steps.setup.outputs.SolutionName }}
              run: |
                dotnet test ${{ inputs.solution-path }} \
                --no-restore \
                --no-build \
                --configuration Release \
                --logger "trx;LogFileName=test_results.trx"

            - name: Publish Test Results
              uses: actions/upload-artifact@v4
              with:
                name: solution-test-results
                path: test_results.trx  