name: CI-Solution-Service-One
on: 
  workflow_dispatch:
  push:
    branches: 
      - main
    paths:
        - 'microservices/Playground.Service.One/src/**'

jobs:
    build:
      uses: ./.github/workflows/docker-service-build.yaml
      with:
        solution-name: 'playground'
        service-root: './microservices/Playground.Service.One'
        service-name: 'service-one'
        image-registry: 'registryshrew.azurecr.io'
        image-tag: "1.0.0.${{ github.run_number }}"
      secrets:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 