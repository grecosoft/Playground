name: CI-Shared Service Solution

on: 
  workflow_dispatch:
  push:
    branches: 
      - main
      - develop
    paths:
        - 'common/src/**'
jobs:
    build:
      uses: ./.github/workflows/dotnet-solution-build.yaml
      with:
        solution-path: './common/src/Common.Services.slnx'
        dotnet-version: '10.0.x'

    package:
      needs: build
      uses: ./.github/workflows/dotnet-solution-package.yaml
      with:
        solution-path: './common/src/Common.Services.slnx'
        dotnet-version: '10.0.x'
      secrets:
        PUBLISH_PACKAGE_TOKEN: ${{ secrets.PUBLISH_PACKAGE_TOKEN }}

