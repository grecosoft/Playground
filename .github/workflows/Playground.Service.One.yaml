name: Test Federated Identity

on: 
  workflow_dispatch:
  push:
    branches: 
      - main

permissions:
  id-token: write
  contents: read


jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: Azure Login
          uses: azure/login@v1
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - name: Display Azure Account Info
          run: az account show

        - name: Log Into ACR
          run: az acr login --name registryshrew

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment: dev
      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: Azure Login
          uses: azure/login@v1
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - name: Display Azure Account Info
          run: az account show

    
    