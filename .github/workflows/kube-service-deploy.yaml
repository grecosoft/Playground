name: Deploy Kubernetes Service
on: 
    workflow_call:
        inputs:
            environment:
                description: 'Deployment environment (e.g., dev, stg, prod)'
                type: string
                required: true
            k8s-resource-group:
                description: 'Azure Resource Group where the AKS cluster is located'
                type: string
                required: true
            k8s-cluster-name:
                description: 'Name of the AKS cluster to deploy to'
                type: string
                required: true
            # image-registry:
            #     description: 'Container registry where the built image is located (e.g., ghcr.io/your-org)'
            #     type: string
            #     required: true
            # image-tag:
            #     description: 'Tag of the Docker image to deploy (e.g., latest or 1.0.0)'
            #     type: string
            #     required: true
            # debug:
            #     description: 'Flag to enable debug logging'
            #     type: boolean
            #     default: false
        secrets:
            AZURE_CLIENT_ID:
              description: 'Azure Service Principal Client ID for authentication'
              required: true
            AZURE_TENANT_ID:
              description: 'Azure Tenant ID for authentication'
              required: true
            AZURE_SUBSCRIPTION_ID:
              description: 'Azure Subscription ID for authentication'
              required: true

jobs:
    deploy-service:
        runs-on: ubuntu-latest
        environment:
            name: ${{ inputs.environment }}
        steps:
            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Set AKS context
              uses: azure/aks-set-context@v3
              with:
                resource-group: ${{ inputs.k8s-resource-group }}
                cluster-name: ${{ inputs.k8s-cluster-name }}