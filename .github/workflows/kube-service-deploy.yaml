name: Deploy Kubernetes Service
on: 
    workflow_call:
        inputs:
            solution-name:
                description: 'Name of the solution the service belongs to (used for Docker image naming)'
                type: string
                required: true
            service-name:
                description: 'Name of the service (used for Docker image naming)'
                type: string
                required: true
            environment:
                description: 'Deployment environment (e.g., dev, stg, prod)'
                type: string
                required: true
            deploy-environment-name:
                description: 'Name of the environment to deploy to (e.g., dev, staging, production)'
                type: string
                required: true
            k8s-resource-group:
                description: 'Azure Resource Group where the AKS cluster is located'
                type: string
                required: true
            k8s-cluster-name:
                description: 'Name of the AKS cluster to deploy to'
                type: string
                required: true
            k8s-namespace:
                description: 'Kubernetes namespace to deploy the service into (default: default)'
                type: string
                required: true
            image-registry:
                description: 'Container registry where the built image is located (e.g., ghcr.io/your-org)'
                type: string
                required: true
            image-tag:
                description: 'Tag of the Docker image to deploy (e.g., latest or 1.0.0)'
                type: string
                required: true
        secrets:
            AZURE_CLIENT_ID:
              description: 'Azure Service Principal Client ID for authentication'
              required: true
            AZURE_TENANT_ID:
              description: 'Azure Tenant ID for authentication'
              required: true
            AZURE_SUBSCRIPTION_ID:
              description: 'Azure Subscription ID for authentication'
              required: true

jobs:
    deploy-service:
        runs-on: ubuntu-latest
        environment:
            name: ${{ inputs.environment }}
        steps:
            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Set AKS context
              uses: azure/aks-set-context@v3
              with:
                resource-group: ${{ inputs.k8s-resource-group }}
                cluster-name: ${{ inputs.k8s-cluster-name }}

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: kubernetes-manifests-${{ github.run_id }}
                path: ./manifests/

            - name: Set Manifest Variables
              run: |
                export CLIENT_ID=${{ vars.AZURE_CLIENT_ID }} 
                export TENANT_ID=${{ vars.AZURE_TENANT_ID }} 

                envsubst < ./manifests/${{ inputs.deploy-environment-name }}-resources.yaml > \
                ./manifests/${{ inputs.deploy-environment-name }}-resources.yaml

                cat ./manifests/${{ inputs.deploy-environment-name }}-resources.yaml

            - name: Determine image to deploy
              id: image-tag
              run: |
                IMAGE_TAG="${{ inputs.image-registry }}/${{ inputs.solution-name }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"
                echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Deploy to Kubernetes cluster
              uses: azure/k8s-deploy@v1
              with:
                namespace: ${{ inputs.k8s-namespace }}
                manifests: |
                    ./manifests/${{ inputs.deploy-environment-name }}-resources.yaml
                images: |
                    ${{ steps.image-tag.outputs.IMAGE_TAG }}