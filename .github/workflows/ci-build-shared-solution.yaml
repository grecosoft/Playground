name: CI-Shared Service Solution

on: 
  workflow_dispatch:
  push:
    branches: 
      - main
    paths:
        - './src/shared/**'  # Trigger only when files in the shared directory are changed
    
jobs:
    build-solution:
      uses: ./.github/workflows/dotnet-build-test-solution.yaml
      with:
        solution-path: './shared/src/Playground.Common.sln'
        dotnet-version: '10.0.x'

    package-solution:
      needs: build-solution
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: Cache NuGet packages
          uses: actions/cache@v4
          with:
            path: ~/.nuget/packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

        - name: List Directory Contents
          run: ls -R -a /home/runner/.nuget/ 