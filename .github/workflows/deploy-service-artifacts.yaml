name: Assemble service deployment artifacts
on:
    workflow_call:
        inputs:
            service-root:
                description: 'Name of the service (used for Docker image naming)'
                type: string
                required: true

jobs:
    gather-deploy-artifacts:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4                 

            - name: ManifestGeneration
              run: |
                for dir in "${inputs.service-root}/k8s/envs/*"; do
                    echo "Processing: $dir"
                    (
                        env_name=$(basename "$dir")
                        echo "Running kustomize on Environment: ${env_name} located at: ${dir}"
                        cd $dir
                        
                        kubectl kustomize . > "${env_name}-resources.yaml"
                    )
                done

            - name: List Files
              run: ls -R "${inputs.service-root}/k8s/envs/"
