name: 'Build Shared Solution'
description: 'Restores, builds, and tests .NET solution.'

inputs:
  solution-path:
    description: 'Path to the solution file to build'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      shell: bash
      run: dotnet restore ${{ inputs.solution-path }}

    - name: Build
      shell: bash
      run: | 
        dotnet build ${{ inputs.solution-path }} \
          --no-restore \
          --configuration Release

    - name: Test
      shell: bash
      run: |
        dotnet test ${{ inputs.solution-path }} \
          --no-restore \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=test_results.trx"

    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      with:
        name: solution-test-results  
