name: Load Azure App Configuration
description: Loads Azure App Configuration values for a given label and exposes them as environment variables

inputs:
  appconfig-name:
    description: The name of the Azure App Configuration instance
    required: true
  label:
    description: The label to filter configuration keys by
    required: true
  key-prefix:
    description: Optional key prefix to trim from configuration keys
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Load Azure App Configuration
      shell: bash
      env:
        KEY_PREFIX: ${{ inputs.key-prefix }}
      run: |
        az appconfig kv list \
          --name ${{ inputs.appconfig-name }} \
          --label ${{ inputs.label }} \
          --auth-mode login \
          --output json \
        | jq -r '.[] | "\(.key)=\(.value)"' \
        | while IFS='=' read -r key value; do
            trimmed_key=$(echo "$key" | sed "s|^${KEY_PREFIX}||")
            sanitized_key=$(echo "$trimmed_key" | tr ':' '_' | tr '-' '_' | tr '[:lower:]' '[:upper:]')
            echo "$sanitized_key=$value" >> $GITHUB_ENV
          done