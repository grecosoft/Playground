apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    azure.workload.identity/client-id: e75e84b5-b68c-47ef-a88b-419de6ab1af9
    azure.workload.identity/tenant-id: ${WORKLOAD_TENANT_ID}
  labels:
    azure.workload.identity/use: "true"
    domain: messaging-demo
    service: messaging-hub-api
  name: messaging-hub-api-sa
---
apiVersion: v1
data:
  CACHE_TTL_SECONDS: "300"
  FEATURE_FLAG_ENABLED: "true"
kind: ConfigMap
metadata:
  labels:
    domain: messaging-demo
    service: messaging-hub-api
  name: messaging-hub-api-configmap
---
apiVersion: v1
kind: Service
metadata:
  labels:
    domain: messaging-demo
    service: messaging-hub-api
  name: messaging-hub-api-service
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    domain: messaging-demo
    service: messaging-hub-api
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    domain: messaging-demo
    service: messaging-hub-api
  name: messaging-hub-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      domain: messaging-demo
      service: messaging-hub-api
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        domain: messaging-demo
        service: messaging-hub-api
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: messaging-hub-api-configmap
        image: <ci>
        name: messaging-hub-api
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /service/configs
          name: config-volume
      serviceAccountName: messaging-hub-api-sa
      volumes:
      - configMap:
          name: messaging-hub-api-appconfig
        name: config-volume
---
apiVersion: azconfig.io/v1
kind: AzureAppConfigurationProvider
metadata:
  labels:
    domain: messaging-demo
    service: messaging-hub-api
  name: messaging-hub-api-appconfig-provider
spec:
  auth:
    workloadIdentity:
      serviceAccountName: messaging-hub-api-sa
  configuration:
    selectors:
    - keyFilter: '*'
      labelFilter: messaging-hub-api
  endpoint: ${APP_CONFIG_ENDPOINT}
  target:
    configMapData:
      key: appsettings.k8s.json
      type: json
    configMapName: messaging-hub-api-appconfig
