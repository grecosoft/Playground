apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      domain: <patch>
      service: <patch>
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: <patch>
      containers:
        - name: service-api
          image: <patch>
          envFrom:
            - configMapRef:
                name: configmap 
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts: 
            - name: appconfig-volume
              mountPath: /service/configs
            - name: appconfig-secrets-volume
              mountPath: /service/secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: appconfig-volume 
          configMap: 
            name: <patch>
        - name: appconfig-secrets-volume 
          secret: 
            secretName: <patch>


