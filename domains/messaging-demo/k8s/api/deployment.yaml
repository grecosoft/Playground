apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-hub-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging-hub-api
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: messaging-hub-api
    spec:
      serviceAccountName: messaging-hub-api-sa
      containers:
        - name: messaging-hub-api
          image: <ci>
          envFrom:
            - configMapRef:
                name: messaging-hub-api-configmap
          ports:
            - containerPort: 80
          volumeMounts: 
            - name: config-volume
              mountPath: /service/configs
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config-volume 
          configMap: 
            name: <patch>