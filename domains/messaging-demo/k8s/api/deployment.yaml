apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      domain: <patch>
      service: <patch>
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: <patch>
      containers:
        - name: service-api
          image: <patch>
          envFrom:
            - configMapRef:
                name: configmap 
            - secretRef:
                name: <patch>
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -z "$(ls -A /service/secrets 2>/dev/null)" ]; then
                    echo "App configuration secrets are missing or empty at /service/secrets. Verify AzureAppConfigurationProvider secret sync and Key Vault RBAC." >&2
                    exit 1
                  fi
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -n "$(ls -A /service/secrets 2>/dev/null)"
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          volumeMounts: 
            - name: config-volume
              mountPath: /service/configs
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config-volume 
          configMap: 
            name: <patch>